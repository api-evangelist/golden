docs: https://docs.golden.com
company_status:
  state: acquired
  acquirer: ComplyAdvantage
  announced: '2024-04-24'
  source: https://golden.com/
  note: >-
    golden.com's home page is now an acquisition notice: "Golden — the knowledge
    graph now part of ComplyAdvantage". It states that on 24 April 2024
    ComplyAdvantage acquired Golden, that Golden's data-extraction and
    entity-disambiguation methods now feed ComplyAdvantage's ingestion pipeline,
    that Golden's AI/LLM specialists joined ComplyAdvantage's data science team,
    and that founder Jude Gomila became a ComplyAdvantage board observer and
    special advisor. The product site (pricing, signup, query, docs) and the
    Public API v2 host are nonetheless still live and self-serve as of
    2026-08-14.
versioning:
  scheme: uri-path
  current: v2
  base_path: /api/v2/public
  note: >-
    The public API is versioned in the URL path (v2 is current). No dated or
    header-based versioning is documented.
deprecation:
  policy_url: null
  sunset_header: false
  note: >-
    No published deprecation policy and no RFC 8594 Sunset/Deprecation header
    support. No Deprecation pointer is wired in apis.yml.
  observed_decommissions:
  - subject: docs.golden.com rendering pipeline
    date: '2026-07-02'
    evidence: >-
      An HTML comment served in the docs page reads verbatim: "Scalar API
      reference. Static snapshot of the Golden API v2 spec, previously proxied
      from the entity-graph API server (pathfinder, decommissioned 2026-07-02)."
      The docs are therefore a frozen snapshot, no longer generated from a live
      server, and the host answers 200 with the same shell for every path.
    source: https://docs.golden.com/
  - subject: Golden Protocol (golden.xyz) and its GraphQL API
    date: null
    evidence: >-
      golden.xyz, docs.golden.xyz and dapp.golden.xyz all fail DNS resolution
      (SERVFAIL) as of 2026-08-14. The first-party godel Python SDK, still
      pushed to GitHub on 2026-08-06, documents this host as its API target and
      its documentation home. No deprecation notice was published.
    source: https://github.com/goldenrecursion/godel
  - subject: first-party PyPI distributions (godel, goldnlp)
    date: null
    evidence: >-
      Both PyPI projects still exist and report project-status "active", but the
      PEP 691 index lists zero versions and zero files for each, so the
      published SDKs are no longer installable. See
      packages/golden-packages.yml.
    source: https://pypi.org/simple/godel/
