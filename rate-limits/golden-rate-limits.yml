limits: []
note: >-
  Golden publishes NO numeric rate limit for the Public API v2. The OpenAPI
  declares a 429 response on every operation with the machine-readable code
  `throttled` and the detail string "Request was throttled.", and the pricing
  page meters a monthly "data credits" allowance per plan — but no requests-per-
  second, per-minute, per-hour or per-day figure is stated anywhere on the
  developer surface, and no burst allowance is described. An integrator cannot
  size a client from the published material. Recorded as limit_count 0: an
  honest zero, not an unchecked field.
