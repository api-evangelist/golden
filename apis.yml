aid: golden
name: Golden
description: >-
  Golden is a company-data and knowledge-graph platform that builds a
  continuously updated, citation-backed map of companies, technologies,
  people, and the relationships between them. The Golden Public API v2 gives
  developers programmatic, read access to that knowledge graph: retrieve
  entities and their properties, resolve the schema of entity types and
  predicates, and run natural-language Queries that return curated,
  source-cited lists of entities (for example, "companies in the artificial
  intelligence industry"). Authentication is via an API key passed in the
  `apikey` header, responses are cursor-paginated, and the API is documented
  with an OpenAPI 3.1 specification. Golden was founded in San Francisco in
  2017 by Jude Gomila, raised roughly $59.5M led by a16z with DCVC, Founders
  Fund, Gigafund and SV Angel participating, and was acquired by financial-
  crime-intelligence firm ComplyAdvantage in April 2024; the product site,
  self-serve plans and the Public API v2 host remain live and reachable.
